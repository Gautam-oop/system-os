<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>missionOS | AI Workforce Operating System</title>
  <meta name="description" content="Next-generation AI workforce operating system for software engineering teams with intelligent automated teammates, Kanban boards, and product roadmaps.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="styles/main.css?v=28">
  <link rel="stylesheet" href="styles/components.css?v=28">
  <link rel="stylesheet" href="styles/auth.css?v=28">
  <link rel="stylesheet" href="styles/landing.css?v=28">
</head>
<body class="theme-light">
  <!-- Landing Container Host -->
  <div id="landing-container" class="landing-container"></div>

  <!-- Auth Container Host -->
  <div id="auth-container" class="auth-container" style="display: none;"></div>

  <div id="app" class="app-layout" style="display: none;">
    <!-- Sidebar Component Host -->
    <aside id="sidebar-host" class="sidebar-container"></aside>
    
    <!-- Main Shell -->
    <div class="main-wrapper">
      <!-- Navbar Component Host -->
      <header id="navbar-host" class="navbar-container"></header>
      
      <!-- Main Dynamic Content Area -->
      <main id="main-content" class="main-content">
        <!-- View sections dynamically loaded or toggled via App Router -->
        <section id="view-overview" class="view-section active"></section>
        <section id="view-agents" class="view-section"></section>
        <section id="view-tasks" class="view-section"></section>
        <section id="view-timeline" class="view-section"></section>
        <section id="view-activity" class="view-section"></section>
        <section id="view-warroom" class="view-section"></section>
        <section id="view-decisionlog" class="view-section"></section>
        <section id="view-analytics" class="view-section"></section>
        <section id="view-report" class="view-section"></section>
      </main>
    </div>
  </div>

  <!-- Global Modal Hosts -->
  <div id="modal-host"></div>
  <div id="approval-modal-host"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Modules -->
  <script type="module" src="js/app.js?v=28"></script>
</body>
</html>
